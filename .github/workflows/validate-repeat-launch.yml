name: Validate repeat URL launch fix
on:
  push:
    branches: [ci/check-orientation]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse affected Swift
        run: |
          swiftc -frontend -parse \
            'scrcpy-app/Scrcpy Remote/AppSchemeManagerV2.swift' \
            'scrcpy-app/Scrcpy Remote/SessionConnectionManager.swift' \
            'scrcpy-app/Scrcpy Remote/IPhoneOrientationSync.swift' \
            'scrcpy-app/Scrcpy Remote/MainContentView.swift'
